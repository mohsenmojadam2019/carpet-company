name: Laravel CI

on:
  push:
    branches:
      - main
      - feat/luxury-carpet-commerce
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php84-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php84-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          mkdir -p database storage/framework/{cache,sessions,views} storage/logs bootstrap/cache
          touch database/database.sqlite
          php artisan key:generate --force

      - name: Validate application boot
        run: |
          php artisan about
          php artisan route:list
          php artisan migrate --force
          php artisan db:seed --force
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      - name: Run tests
        run: php artisan test --without-tty
